id: hotel_business_event_2026
title: 'Hotel Business Event 2026'
description: '<p>Hotel Business Event 2026</p>'
categories:
  - visitor
  - domain_hb
elements: |-
  intro_text:
    '#type': processed_text
    '#text': '<p>Registreer u hieronder als bezoeker van Hotel Business Event 2026 - donderdag 22 oktober 2026. Na de registratie ontvangt u een e-mail met uw toegangsticket in bijlage ter bevestiging. Gelieve dat toegangsticket af te drukken en mee te brengen bij uw bezoek aan Hotel Business Event 2026.</p><p><em>Iedere bezoeker dient zich apart te registreren!</em></p><p><em>Tijdens het evenement&nbsp;gebruiken we een QR code die verbonden is met uw contactgegevens (naam bedrijf, naam en e mail) die u heeft ingevuld tijdens uw registratie. Deze QR code kan ingescand worden door de exposant op de door u bezochte stand.</em></p><p><strong>Organisatie:&nbsp;</strong> FCO Media, +32 (0)56 77 13 10, <a href="mailto:info@aquarama.be">info@aquarama.be</a>&nbsp;</p>'
    '#format': basic_html
  mijn_profiel:
    '#type': radios
    '#title': 'Mijn profiel'
    '#options':
      Owner: 'Eigenaar van een hotel of logies'
      Manager: 'Manager van een hotel of logies'
      Active: 'Werkzaam in een hotel of logies'
      Consultant: Consultant
      Supplier: 'Toeleverancies of hotel- of logiessector'
    '#required': true
  price_message_free:
    '#type': webform_message
    '#states':
      invisible:
        - ':input[name="mijn_profiel"]':
            unchecked: true
        - or
        - ':input[name="mijn_profiel"]':
            value: Supplier
    '#display_on': both
    '#message_type': info
    '#message_message': '<p>Uw deelname is gratis.<br>Let op: kosteloos annuleren is mogelijk tot en met 19 oktober 2026. Bij te late annulering or afwezigheid zonder kennisgeving worden no-showkosten van 95 euro in rekening gebracht.</p>'
  price_message_pay:
    '#type': webform_message
    '#states':
      visible:
        ':input[name="mijn_profiel"]':
          value: Supplier
    '#display_on': both
    '#message_type': warning
    '#message_message': '<p>Toeleveranciers die geen exposant zijn betalen een bijdrage van 250 euro (excl. btw) per persoon voor toegang tot het netwerkevent.<br>Let op: kosteloos annuleren kan tot en met 19 oktober 2026</p>'
  mijjn_beursbezoek:
    '#type': radios
    '#title': 'Mijn beursbezoek'
    '#options':
      visit: |-
        Bezoek exporuimte -- 09:00 - 17:00
        <br>Donderdag 22 oktober 2026 van 9u tot 17u - Brabanthal Leuven
    '#required': true
    '#default_value': visit
  mijn_congres:
    '#type': checkboxes
    '#title': 'Mijn congres'
    '#description': '<h4 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Roboto, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.1;margin-bottom:10px;margin-top:10px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">FUTURE-PROOF HOSPITALITY</h4><p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(51, 51, 51);display:inline !important;float:none;font-family:Roboto, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Inschrijven voor één of meerdere sessies is inclusief netwerklunch.</span></p>'
    '#title_display': before
    '#description_display': before
    '#options':
      'Hotelconcepten in de praktijk': 'Hotelconcepten in de praktijk<br>Paul Suy -- 10:00 - 11:00'
      'De financiële weerbaarheid van hotels': 'De financiële weerbaarheid van hotels<br>Stef Driessen - ABN AMRO -- 11:00 - 12:00'
      'Guestology: de wetenschap achter de gastbeleving': 'Guestology: de wetenschap achter de gastbeleving<br>Goof Lukken -- 13:15 - 14:15'
      'Van SEO naar GEO: zichtbaar blijven in het AI-tijdperk': 'Van SEO naar GEO: zichtbaar blijven in het AI-tijdperk<br>Rachel Persoon -- 14:15 - 15:15'
  uw_prijs:
    '#type': webform_computed_twig
    '#title': 'Uw prijs'
    '#template': |-
      {% set profiel = data.mijn_profiel|default([]) %}

      {% set is_supplier = 'Supplier' in profiel %}
      {% set total = 0 %}

      {% if is_supplier %}
        {% set total = total + 250 %}
      {% endif %}

      €{{ total }}
    '#whitespace': spaceless
    '#hide_empty': true
    '#store': true
    '#ajax': true
  contact:
    '#type': radios
    '#title': 'Mogen exposanten van dit event u na afloop contacteren met informatie over hun producten en diensten?'
    '#options':
      contact_yes: 'Ja, ik geef toestemming dat mijn gegevens worden gedeeld met exposanten die relevant zijn voor mijn interesses.'
      contact_no: 'Nee, ik wens niet gecontacteerd te worden door exposanten.'
    '#required': true
    '#required_error': 'Duid uw contactvoorkeur aan'
  ean_code:
    '#type': hidden
    '#title': 'EAN code'
  language:
    '#type': hidden
    '#title': Language
    '#default_value': '[language:langcode]'
