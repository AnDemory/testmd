id: aquarama_trade_fair_2026
title: 'Aquarama Trade Fair 2026'
description: '<p>Aquarama Trade Fair 2026</p>'
categories:
  - visitor
elements: |-
  intro_text:
    '#type': processed_text
    '#text': '<p>Registreer u hieronder als bezoeker van de Aquarama Trade Fair 2026. Na de registratie ontvangt u een e-mail met uw toegangsticket in bijlage ter bevestiging.</p><p><em>Iedere bezoeker dient zich apart te registreren!</em></p><p><strong>Organisatie:&nbsp;</strong> FCO Media, +32 (0)56 77 13 10, <a href="mailto:info@aquarama.be">info@aquarama.be</a>&nbsp;</p>'
    '#format': basic_html
  mijjn_beursbezoek:
    '#type': radios
    '#title': 'Mijjn beursbezoek'
    '#options':
      visit: 'GRATIS beursbezoek -- 09:30 - 18:00'
    '#required': true
    '#default_value': visit
  mijn_congres:
    '#type': checkboxes
    '#title': 'Mijn congres'
    '#options':
      'Watercircle.be - VMx': |-
        Watercircle.be - VMx -- 09:30 - 13:00
        Studenten: €25, Watercircle.be-leden: €50, VMX-leden: €75; niet-leden: €100
        <br>Betaling na ontvangst factuur. Inschrijving is pas definitief na betaling.
      Vlario: |-
        Vlario -- 10:15 - 16:00
        <br>Gratis, no show: € 50
      AquaFlanders: 'AquaFlanders -- 14:00 - 16:00 <br>Gratis, no show: €50'
      Cebedeau: |-
        Cebedeau -- 13:30 - 15:00
        <br>Gratis, no show: €50
      'Interreg NEW WATER': |-
        Interreg NEW WATER -- 14:00 - 15:00
        <br>Gratis, no show: €50
      B-IWA: |-
        B-IWA -- 15:00 - 16:15
        <br>B-IWA- members: free, non-members: €50, now show: €50
  mijn_lidmaatschap:
    '#type': checkboxes
    '#title': 'Mijn lidmaatschap'
    '#options':
      'Lid watercircle.be': 'Lid watercircle.be'
      'Lid VMX': 'Lid VMX'
      'Lid B-IWA': 'Lid B-IWA'
      Student: 'Student -- U bent student bachelor of master, een inschrijvingsbewijs kan opgevraagd worden'
    '#options_none': true
    '#options_none_value': 'Geen van bovenstaande'
    '#options_none_text': 'Geen van bovenstaande'
    '#required': true
  uw_prijs:
    '#type': webform_computed_twig
    '#title': 'Uw prijs'
    '#template': |-
      {% set congressen = data.mijn_congres|default([]) %}
      {% set lidmaatschap = data.mijn_lidmaatschap|default([]) %}

      {% set is_student = 'Student' in lidmaatschap %}
      {% set is_member_watercircle = 'Lid watercircle.be' in lidmaatschap %}
      {% set is_member_vmx = 'Lid VMX' in lidmaatschap %}
      {% set is_member_biwa = 'Lid B-IWA' in lidmaatschap %}

      {% set total = 0 %}

      {# Watercircle.be - VMx #}
      {% if 'Watercircle.be - VMx' in congressen %}
        {% if is_student %}
          {% set total = total + 25 %}
        {% elseif is_member_watercircle %}
          {% set total = total + 50 %}
        {% elseif is_member_vmx %}
          {% set total = total + 75 %}
        {% else %}
          {% set total = total + 100 %}
        {% endif %}
      {% endif %}

      {# B-IWA #}
      {% if 'B-IWA' in congressen %}
        {% if is_member_biwa %}
          {% set total = total + 0 %}
        {% else %}
          {% set total = total + 50 %}
        {% endif %}
      {% endif %}

      €{{ total }}
    '#whitespace': spaceless
    '#hide_empty': true
    '#store': true
    '#ajax': true
  contact:
    '#type': radios
    '#title': 'Mogen exposanten van dit event u na afloop contacteren met informatie over hun producten en diensten?'
    '#options':
      contact_yes: 'Ja, ik geef toestemming dat mijn gegevens worden gedeeld met exposanten die relevant zijn voor mijn interesses.'
      contact_no: 'Nee, ik wens niet gecontacteerd te worden door exposanten.'
    '#required': true
    '#required_error': 'Duid uw contactvoorkeur aan'
