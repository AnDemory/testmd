id: fm_day_2026
title: 'FM-Day 2026'
description: ''
categories:
  - visitor
elements: |-
  intro_text:
    '#type': processed_text
    '#text': '<p>Registratie bezoek netwerkdag FM DAY 2026</p><p>Registreer u hieronder als bezoeker van de FM DAY - donderdag 22 oktober 2026. Na de registratie ontvangt u een e-mail met uw toegangsticket in bijlage ter bevestiging. Gelieve dat toegangsticket af te drukken en mee te brengen bij uw bezoek aan FM DAY 2026.</p><p><em>Iedere bezoeker dient zich apart te registreren!</em></p><p><em>Tijdens het evenement&nbsp;gebruiken we een QR code die verbonden is met uw contactgegevens (naam bedrijf, naam en e mail) die u heeft ingevuld tijdens uw registratie. Deze QR code kan ingescand worden door de exposant op de door u bezochte stand.&nbsp;</em></p><p><strong>Organisatie: </strong>FCO Media, +32 (0)56 77 13 10, <a href="mailto:info@fcomedia.be">info@fcomedia.be</a></p><p>&nbsp;</p><p>&nbsp;</p>'
    '#format': basic_html
  visit:
    '#type': radios
    '#title': 'Mijn beursbezoek'
    '#options':
      visit: 'GRATIS bezoek netwerkdag -- Donderdag 22 oktober 2026 van 9u tot 17u'
    '#required': true
    '#default_value': visit
  profile_custom:
    '#type': radios
    '#title': 'Mijn lidmaatschap'
    '#description': '<p>Ik ben</p>'
    '#description_display': before
    '#options':
      member: 'Lid belfa'
      non_member: 'Geen lid belfa'
    '#required': true
    '#required_error': 'Lidmaatschap aanduiden verplicht'
  contact:
    '#type': radios
    '#title': Contact
    '#description': '<p><b style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:Roboto, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong>Mogen exposanten van dit event u na afloop contacteren met informatie over hun producten en diensten?</strong></b><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(51, 51, 51);display:inline !important;float:none;font-family:Roboto, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"> </span><span class="text-primary" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(10, 152, 132);font-family:Roboto, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">*</span></p>'
    '#description_display': before
    '#options':
      contact_yes: 'Ja, ik geef toestemming dat mijn gegevens worden gedeeld met exposanten die relevant zijn voor mijn interesses.'
      contact_no: 'Nee, ik wens niet gecontacteerd te worden door exposanten.'
    '#required': true
    '#required_error': 'Duid uw contactwens aan'
  processed_text:
    '#type': processed_text
    '#text': '<ul><li data-list-item-id="e2b64c6bf27e40a01e3b4117facf926bf">Iedere bezoeker dient zich met een <strong>eigen account (e-mailadres)</strong> te registreren.</li><li data-list-item-id="ef2083c6cc668fc0443868520fbed23af">Gelieve elke wijziging aan uw registratie <strong>eerst op te slaan</strong> voordat u het toegangsticket opnieuw downloadt of verzendt.</li></ul>'
    '#format': basic_html
