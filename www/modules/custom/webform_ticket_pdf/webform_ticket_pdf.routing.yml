webform_ticket_pdf.my_registration:
  path: '/my-registration'
  defaults:
    _controller: '\Drupal\webform_ticket_pdf\Controller\MyRegistrationController::page'
    _title: 'My registration'
  requirements:
    _user_is_logged_in: 'TRUE'


webform_ticket_pdf.exhibitor_registration:
  path: '/exhibitor-registration'
  defaults:
    _controller: '\Drupal\webform_ticket_pdf\Controller\ExhibitorRegistrationController::page'
    _title: 'Exhibitor registration'

webform_ticket_pdf.exhibitor_registration_ticket:
  path: '/exhibitor-registration/ticket/{webform_submission}'
  defaults:
    _controller: '\Drupal\webform_ticket_pdf\Controller\ExhibitorRegistrationController::page'
    _title: 'Exhibitor ticket'
  requirements:
     _custom_access: '\Drupal\webform_ticket_pdf\Controller\MyRegistrationController::access'
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission

webform_ticket_pdf.download_ticket:
  path: '/ticket/{webform}/submission/{webform_submission}'
  defaults:
    _controller: '\Drupal\webform_ticket_pdf\Controller\TicketDownloadController::download'
  requirements:
    _custom_access: '\Drupal\webform_ticket_pdf\Controller\MyRegistrationController::access'
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission

webform_ticket_pdf.email_ticket:
  path: '/ticket/{webform}/submission/{webform_submission}/email'
  defaults:
    _controller: '\Drupal\webform_ticket_pdf\Controller\TicketEmailController::send'
    _title: 'Email ticket'
  requirements:
    _custom_access: '\Drupal\webform_ticket_pdf\Controller\MyRegistrationController::access'
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission

webform_ticket_pdf.print_ticket:
  path: '/ticket/submission/{webform_submission}/print'
  defaults:
    _controller: '\Drupal\webform_ticket_pdf\Controller\TicketPrintController::print'
    _title: 'Print ticket'
  requirements:
    _custom_access: '\Drupal\webform_ticket_pdf\Controller\MyRegistrationController::access'
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission

webform_ticket_pdf.admin_add_submission:
  path: '/admin/webform/{webform}/submission/add'
  defaults:
    _controller: '\Drupal\webform\Controller\WebformEntityController::addForm'
    _title_callback: '\Drupal\webform\Controller\WebformEntityController::title'
  requirements:
    _entity_access: 'webform.submission_page'
  options:
    _admin_route: TRUE
    parameters:
      webform:
        type: 'entity:webform'
