domain_settings.settings:
  type: config_object
  label: 'Domain settings'
  mapping:
    domains:
      type: sequence
      label: 'Domain settings'
      sequence:
        type: mapping
        label: 'Domain setting'
        mapping:
          domain:
            type: string
            label: 'Domain'
          domain_id:
            type: string
            label: 'Domain ID'
          mail:
            type: email
            label: 'Email address'
          ticket_webform_id:
            type: string
            label: 'Ticket Webform ID'
          ticket_exhibitor_webform_id:
            type: string
            label: 'Ticket Exhibitor Webform ID'
          ticket_visitor_bulk_webform_id:
            type: string
            label: 'Ticket Visitor Bulk Webform ID'
          ticket_template:
            type: string
            label: 'Ticket template'
          lead_retrieval_url:
            type: string
            label: 'Lead Retrieval URL'
